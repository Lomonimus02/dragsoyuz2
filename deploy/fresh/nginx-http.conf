# HTTP — для выпуска сертификата certbot (шаг 1)
# После certbot заменить на nginx-ssl.conf

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name xn--80agbo8ajj9h.xn--p1ai dragsoyuz.ru www.dragsoyuz.ru www.xn--80agbo8ajj9h.xn--p1ai;

    client_max_body_size 50M;

    location /uploads/ {
        alias /root/app/public/uploads/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
