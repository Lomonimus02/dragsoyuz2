limit_req_zone $binary_remote_addr zone=radioklad_domain_login:1m rate=6r/m;
server {
    listen 80;
    listen [::]:80;
    server_name radio-klad.ru www.radio-klad.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/radioklad/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 301 https://radio-klad.ru$rk_seo_request; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.radio-klad.ru;

    ssl_certificate /etc/letsencrypt/live/radio-klad.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radio-klad.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://radio-klad.ru$rk_seo_request;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name radio-klad.ru;

    ssl_certificate /etc/letsencrypt/live/radio-klad.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radio-klad.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($request_uri != $rk_seo_request) { return 301 https://radio-klad.ru$rk_seo_request; }

    client_max_body_size 6m;
    client_body_timeout 15s;
    add_header X-Content-Type-Options nosniff always;
    location = /admin/login {
        limit_req zone=radioklad_domain_login burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3160;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://127.0.0.1:3160;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
