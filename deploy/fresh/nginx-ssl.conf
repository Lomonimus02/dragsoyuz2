# HTTPS — после выпуска сертификатов certbot (шаг 2)
# Заменить /etc/nginx/sites-available/radiodetali

# www → без www (драгсоюз.рф)
server {
    listen 80;
    listen [::]:80;
    server_name www.xn--80agbo8ajj9h.xn--p1ai;
    return 301 https://xn--80agbo8ajj9h.xn--p1ai$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.xn--80agbo8ajj9h.xn--p1ai;

    ssl_certificate /etc/letsencrypt/live/xn--80agbo8ajj9h.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80agbo8ajj9h.xn--p1ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://xn--80agbo8ajj9h.xn--p1ai$request_uri;
}

# Основной: драгсоюз.рф
server {
    listen 80;
    listen [::]:80;
    server_name xn--80agbo8ajj9h.xn--p1ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xn--80agbo8ajj9h.xn--p1ai;

    ssl_certificate /etc/letsencrypt/live/xn--80agbo8ajj9h.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80agbo8ajj9h.xn--p1ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    location /uploads/ {
        alias /root/app/public/uploads/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

