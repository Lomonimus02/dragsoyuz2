services:
  db:
    image: postgres:16-alpine
    container_name: radiodetali_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radiodetali}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-radiodetali}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radiodetali} -d ${POSTGRES_DB:-radiodetali}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/vjf2g46p6j-cloud/radiodetali:latest
    container_name: radiodetali_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "80:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-radiodetali}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-radiodetali}?schema=public
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
    volumes:
      - ./public/uploads:/app/public/uploads

volumes:
  postgres_data:
